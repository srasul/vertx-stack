name: vertx-stack (4.x)
on:
  workflow_dispatch:
  push:
    branches:
      - javadoc_search_field
#      - master
#      - '[0-9]+.[0-9x]+'
#  pull_request:
#    branches:
#      - master
#      - '[0-9]+.[0-9x]+'
#  schedule:
#    - cron:  '0 4 * * *'
jobs:
  Test:
    name: Run tests
    strategy:
      matrix:
        os: [ubuntu-latest]
        jdk: [8]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: adopt
          cache: maven
          java-version: ${{ matrix.jdk }}
      - name: Run tests
#        run: mvn -q clean verify -B -DskipDocker -DskipNpm -DskipTests
        run: mvn --version


  # Deployment job
  deploy:
    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
    environment:
      name: github-pages
      url: ${{ steps.upload-docs-step.outputs.page_url }}
    runs-on: ubuntu-latest
#    needs: Test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: adopt
          cache: maven
          java-version: |
            8
            21
      - run: mvn org.apache.maven.plugins:maven-toolchains-plugin:3.2.0:display-discovered-jdk-toolchains
      - run: java --version
      - run: mvn --version
      - run: mvn toolchains:select-jdk-toolchain -Dtoolchain.jdk.version="1.8" -q clean verify -B -DskipDocker -DskipNpm -DskipTests

